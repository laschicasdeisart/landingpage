<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>laschicasdeisart</title>
<meta name="description" content="Creación de contenido, comunidad, gamificación y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

/* Contenedor que mantiene la proporción 800:1355 del vídeo */
.map-wrap {
  position: relative;
  width:  min(100vw, calc(100vh * 800 / 1355));
  height: min(100vh, calc(100vw * 1355 / 800));
}

.map-wrap video {
  width: 100%; height: 100%;
  display: block;
  object-fit: fill;
}

/* ── Hotspots ── */
.spot {
  position: absolute;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  cursor: pointer;
}

.spot-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  font-family: 'Poppins', sans-serif;
  font-weight: 700;
  font-size: clamp(10px, 1.6vw, 17px);
  letter-spacing: -0.01em;
  line-height: 1.3;
  color: #fff;
  text-shadow:
    0 0 10px rgba(255,255,255,1),
    0 0 25px rgba(255,255,255,0.7),
    0 0 55px rgba(255,255,255,0.3);
  transition: text-shadow 0.35s ease, transform 0.35s ease;
}

.spot:hover .spot-label {
  text-shadow:
    0 0 12px #fff,
    0 0 35px rgba(255,255,255,0.95),
    0 0 70px rgba(255,255,255,0.6),
    0 0 120px rgba(255,255,255,0.2);
  transform: scale(1.06);
}

.spot-label span { display: block; }

/* Posicionamiento vertical del label dentro del hotspot */
.label-below {
  margin-top: auto;  /* empuja al fondo del hotspot */
}
.label-above {
  margin-bottom: auto; /* empuja al inicio del hotspot */
}
</style>
</head>
<body>

<div class="map-wrap">
  <video id="mapVideo" muted playsinline preload="auto">
    <source src="mapa.mp4" type="video/mp4">
  </video>

  <!-- 1 · Wormhole → Creación de contenido / Edición (label debajo) -->
  <a class="spot" href="/creaciondecontenido"
     style="left:2.5%; top:1%; width:39%; height:22%;">
    <div class="spot-label label-below">
      <span>Creación de contenido</span>
      <span>Edición</span>
    </div>
  </a>

  <!-- 2 · Estación espacial → Comunidad / La Cápsula Creativa (label encima) -->
  <a class="spot" href="#"
     style="left:44%; top:21%; width:50%; height:18%;">
    <div class="spot-label label-above">
      <span>Comunidad</span>
      <span>La Cápsula Creativa</span>
    </div>
  </a>

  <!-- 3 · Luna → Gamificación / Zenit Experience (label debajo) -->
  <a class="spot" href="#"
     style="left:5%; top:34%; width:42%; height:24%;">
    <div class="spot-label label-below">
      <span>Gamificación</span>
      <span>Zenit Experience</span>
    </div>
  </a>

  <!-- 4 · Pequeña esfera → Flowly (label debajo) -->
  <a class="spot" href="https://flowlysystem.io" target="_blank" rel="noopener"
     style="left:42%; top:50%; width:26%; height:10%;">
    <div class="spot-label label-below">
      <span>Flowly</span>
    </div>
  </a>

  <!-- 5 · Nave espacial → Youtube (label encima) -->
  <a class="spot" href="#"
     style="left:3%; top:82%; width:36%; height:14%;">
    <div class="spot-label label-above">
      <span>Youtube</span>
    </div>
  </a>
</div>

<script>
/* ── Ping-pong: reproduce hacia adelante y hacia atrás sin corte ── */
const video = document.getElementById('mapVideo');
video.muted = true;

let reversing = false;
let rafId = null;
const STEP = 1 / 30; // ~30fps backward

function reverseStep() {
  video.currentTime = Math.max(0, video.currentTime - STEP);
  if (video.currentTime <= 0.04) {
    reversing = false;
    video.play();
    return;
  }
  rafId = requestAnimationFrame(reverseStep);
}

video.addEventListener('ended', () => {
  if (reversing) return;
  reversing = true;
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(reverseStep);
});

video.play().catch(() => {
  // Autoplay bloqueado: esperar interacción
  document.addEventListener('click', () => video.play(), { once: true });
  document.addEventListener('touchstart', () => video.play(), { once: true });
});
</script>
</body>
</html>
